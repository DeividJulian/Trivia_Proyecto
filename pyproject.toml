[project]
name = "testquiz-saboteador"
version = "1.0.0"
description = "Backend de TestQuiz – El Saboteador"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "S"]

[tool.ruff.lint.per-file-ignores]
# DEF-001 (riesgo aceptado): S101 marca cada "assert", pero en pytest el assert ES la verificación.
# Solo se ignora S101 y solo dentro de tests/; el código de app/ sigue revisado con todas las reglas.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    # Niveles ISTQB
    "componente: prueba de componente (unidad aislada)",
    "integracion: prueba de integración de componentes",
    "sistema: prueba de sistema a través de la API",
    "integracion_sistemas: prueba contra el sistema desplegado (humo)",
    "aceptacion: prueba de aceptación basada en historias de usuario",
    # Tipos
    "no_funcional: prueba no funcional (tiempos, carga)",
    "seguridad: prueba de seguridad",
    # Módulos (para la regresión por análisis de impacto)
    "preguntas: módulo de preguntas (modelos y bancos JSON)",
    "puntaje: módulo de puntaje",
    "ranking: módulo de ranking",
    "partida: módulo de partida",
    "gestor: módulo gestor de partidas",
    "api: capa API",
    "sabotajes: módulo de sabotajes",
]

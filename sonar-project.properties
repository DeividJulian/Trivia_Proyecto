# Análisis de SonarQube Cloud (etapa 3 del pipeline). El token va como secreto SONAR_TOKEN en GitHub.
sonar.projectKey=DeividJulian_Trivia_Proyecto
sonar.organization=deividjulian
sonar.host.url=https://sonarcloud.io

sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.python.version=3.12
# coverage.xml lo genera el job de pruebas (pytest --cov=app) y el job de Sonar lo copia a la raíz.
sonar.python.coverage.reportPaths=coverage.xml
# El front de demostración (HTML, CSS y JS) no tiene herramienta de cobertura: se prueba a nivel de
# sistema (tests/sistema/test_front.py y navegador). Se excluye SOLO de la métrica de cobertura; Sonar
# lo sigue analizando en busca de bugs, vulnerabilidades y code smells (DEF-029).
sonar.coverage.exclusions=app/static/**

# El job falla si el Quality Gate no se aprueba.
sonar.qualitygate.wait=true
